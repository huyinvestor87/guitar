<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Guitar Sound Test</title><style>body{margin:0;background:#111;color:#eee;font-family:system-ui;padding:24px}.app{max-width:800px;margin:auto}button{font-size:17px;padding:12px 16px;margin:5px;border:0;border-radius:10px}.sound{display:grid;grid-template-columns:1fr;gap:8px;margin:18px 0}.sound button{text-align:left;background:#292929;color:#fff}.meta{color:#aaa}.status{margin:18px 0;padding:12px;background:#222;border-radius:10px}input{width:100%}</style></head><body><main class="app"><h1>🎸 Guitar Sound Test · V6</h1><p class="meta">Same short riff, 5 guitar tones. Listen on your iPhone and tell me 1–5.</p><div class="status" id="status">Tap a sound · samples load on first tap</div><div class="sound"><button data-tone="clean">1 · Clean — natural/raw</button><button data-tone="warm">2 · Warm — darker & thicker</button><button data-tone="crunch">3 · Crunch — light rock overdrive</button><button data-tone="lead">4 · Lead — distortion + sustain + delay</button><button data-tone="mute">5 · Palm Mute — tight rhythm</button></div><button id="stop">■ Stop</button><label>Volume <input id="volume" type="range" min="0" max="1" step=".01" value=".7"/></label></main><script type="module" src="app.js?v=6"></script></body></html>
